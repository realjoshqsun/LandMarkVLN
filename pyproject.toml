[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "landmarkvln-reproducibility"
version = "0.2.0"
description = "CPU reproduction of the LandMarkVLN analyses"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
]

[project.urls]
Homepage = "https://realjoshqsun.github.io/landmark-vln/"
Repository = "https://github.com/realjoshqsun/LandMarkVLN"
Documentation = "https://github.com/realjoshqsun/LandMarkVLN/blob/main/REPRODUCIBILITY.md"

[tool.setuptools]
packages = ["landmarkvln"]

[tool.pytest.ini_options]
testpaths = ["tests"]
